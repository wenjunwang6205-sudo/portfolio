name: Generate AI Daily Brief

on:
  schedule:
    # GitHub Actions cron uses UTC. Avoid the top of the hour because it is often delayed.
    # 08:17 Asia/Shanghai primary run, 09:17 backup run for missed/delayed schedules.
    - cron: "17 0 * * *"
    - cron: "17 1 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ai-daily-brief.yml"
      - "ai-pm-portfolio/scripts/generate-daily-brief.mjs"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Brief publish date, format YYYY-MM-DD. Defaults to today in Asia/Shanghai."
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-daily-brief
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-pm-portfolio/package-lock.json

      - name: Install dependencies
        working-directory: ai-pm-portfolio
        run: npm ci

      - name: Generate daily brief
        working-directory: ai-pm-portfolio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: npm run generate:daily

      - name: Commit daily brief
        run: |
          if git diff --quiet -- ai-pm-portfolio/src/constants/dailyData.ts; then
            echo "No daily brief changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-pm-portfolio/src/constants/dailyData.ts
          git commit -m "Update AI daily brief"
          git push

      - name: Build static site
        working-directory: ai-pm-portfolio
        run: npm run build

      - name: Add SPA fallback
        run: cp ai-pm-portfolio/dist/index.html ai-pm-portfolio/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ai-pm-portfolio/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
